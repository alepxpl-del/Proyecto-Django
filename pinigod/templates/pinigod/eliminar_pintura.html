<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nueva Pintura | Galería Arcana</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --lol-blue: #0a84c6;
            --lol-cyan: #28d7e8;
            --lol-gold: #c8aa6e;
            --dark-bg: #07131f;
            --card-bg: #0d2030;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(circle at top, rgba(40, 215, 232, 0.10), transparent 35%),
                linear-gradient(135deg, #050d15, var(--dark-bg));

            color: #f4f1e8;
            font-family: Georgia, "Times New Roman", serif;
        }

        /* NAVBAR */

        .navbar {
            background: rgba(4, 15, 25, 0.96);
            border-bottom: 1px solid rgba(200, 170, 110, 0.55);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
        }

        .navbar-brand {
            color: var(--lol-gold) !important;
            font-size: 1.45rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .navbar-brand span {
            color: var(--lol-cyan);
        }

        /* CONTENIDO */

        .container-main {
            max-width: 800px;
            margin: 0 auto;
            padding: 70px 20px;
        }

        .page-title {
            color: var(--lol-gold);
            text-align: center;
            font-size: 2.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .page-subtitle {
            color: #a9c1cc;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-bottom: 40px;
        }

        /* CARD */

        .painting-card {
            background: linear-gradient(
                145deg,
                rgba(13, 32, 48, 0.98),
                rgba(6, 20, 31, 0.98)
            );

            border: 1px solid rgba(200, 170, 110, 0.55);
            border-radius: 8px;
            padding: 40px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.45),
                0 0 20px rgba(40, 215, 232, 0.06);
        }

        /* FORMULARIO */

        .painting-card label {
            color: var(--lol-gold);
            font-family: Arial, sans-serif;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .painting-card input,
        .painting-card textarea,
        .painting-card select {
            background: #091a28;
            color: #e1ebef;
            border: 1px solid rgba(40, 215, 232, 0.35);
            border-radius: 4px;
            padding: 10px 12px;
            width: 100%;
            font-family: Arial, sans-serif;
        }

        .painting-card input:focus,
        .painting-card textarea:focus,
        .painting-card select:focus {
            background: #0b2030;
            color: white;
            border-color: var(--lol-cyan);
            box-shadow: 0 0 8px rgba(40, 215, 232, 0.20);
            outline: none;
        }

        .painting-card textarea {
            min-height: 150px;
            resize: vertical;
        }

        .painting-card p {
            margin-bottom: 22px;
        }

        .helptext {
            color: #8298a5;
            font-family: Arial, sans-serif;
            font-size: 0.85rem;
        }

        .errorlist {
            color: #ff8f8f;
            font-family: Arial, sans-serif;
            padding-left: 20px;
        }

        /* BOTONES */

        .buttons-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            gap: 15px;
        }

        .btn-create {
            background: var(--lol-gold);
            color: #07131f;
            border: 2px solid var(--lol-gold);
            border-radius: 4px;

            padding: 10px 24px;

            font-family: Arial, sans-serif;
            font-weight: bold;

            transition: 0.25s ease;
        }

        .btn-create:hover {
            background: #e0c78e;
            border-color: #e0c78e;
            color: #07131f;
        }

        .btn-back {
            background: white;
            color: #07131f;
            border: 2px solid white;
            border-radius: 4px;

            padding: 10px 22px;

            font-family: Arial, sans-serif;
            font-weight: bold;
            text-decoration: none;

            transition: 0.25s ease;
        }

        .btn-back:hover {
            background: transparent;
            color: white;
            border-color: var(--lol-cyan);
            box-shadow: 0 0 15px rgba(40, 215, 232, 0.25);
        }

        /* FOOTER */

        footer {
            margin-top: 50px;
            padding: 28px 20px;
            text-align: center;

            border-top: 1px solid rgba(200, 170, 110, 0.3);

            color: #8298a5;
            font-family: Arial, sans-serif;
        }

        /* RESPONSIVE */

        @media (max-width: 600px) {

            .container-main {
                padding: 45px 15px;
            }

            .page-title {
                font-size: 2.2rem;
            }

            .painting-card {
                padding: 25px;
            }

            .buttons-container {
                flex-direction: column-reverse;
                align-items: stretch;
            }

            .btn-create,
            .btn-back {
                text-align: center;
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">
        <div class="container">

            <a class="navbar-brand" href="{% url 'home' %}">
                Galería <span>Arcana</span>
            </a>

        </div>
    </nav>


    <!-- CONTENIDO PRINCIPAL -->

    <main class="container-main">

        <h1 class="page-title">
            Eliminacion de pintura
        </h1>

        <p class="page-subtitle">
            Agrega una nueva obra a la colección.
        </p>


        <!-- FORMULARIO -->

        <div class="painting-card">

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}
                
                <p>tas seguro negraso???</p>


                <!-- BOTONES -->

                <div class="buttons-container">

                    <a href="{% url 'listar_pinturas' %}"
                       class="btn-back">
                        ← Volver atrás
                    </a>

                    <button type="submit"
                            class="btn-create">
                        Confirmar eliminado
                    </button>

                </div>

            </form>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>
        <p class="mb-0">
            Galería Arcana · Proyecto Django
        </p>
    </footer>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
